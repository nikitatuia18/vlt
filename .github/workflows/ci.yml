# Checks for pull requests and for branches other than main (main is checked and published by deploy.yml).
name: Checks

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Screenshots and traces of failed tests (tests/artifacts is git-ignored, test-results holds the failures).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results
            tests/artifacts
          retention-days: 7
